<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <title>день.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231c1a17'/><circle cx='22.5' cy='22.5' r='3.5' fill='%23e5482a'/><path d='M8 9h11M8 14h7' stroke='%23f3efe6' stroke-width='2.4' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&family=Geologica:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="день — на головну">день<span>.</span></a>

    <nav class="day-nav" aria-label="Навігація по днях">
      <button id="prev-day" type="button" class="icon-btn" aria-label="Попередній день">
        <svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="today-btn" type="button" class="text-btn">сьогодні</button>
      <button id="next-day" type="button" class="icon-btn" aria-label="Наступний день">
        <svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="avatar" type="button" class="avatar" hidden></button>
    </nav>
  </header>

  <div id="setup-banner" class="banner" hidden>
    Підключіть Firebase: заповніть <code>public/config.js</code> — інструкція в README.
  </div>

  <main class="sheet">
    <aside class="masthead">
      <div class="date-wrap">
        <button id="date-btn" type="button" class="date" aria-haspopup="dialog" aria-expanded="false" aria-label="Обрати день">
          <span id="date-num" class="date-num"></span>
          <span class="date-words">
            <span id="date-weekday" class="date-weekday"></span>
            <span id="date-month" class="date-month"></span>
          </span>
        </button>

        <div id="calendar" class="calendar" role="dialog" aria-label="Оберіть день" hidden>
          <div class="cal-head">
            <span id="cal-month" class="cal-month"></span>
            <div class="cal-arrows">
              <button id="cal-prev" type="button" class="icon-btn" aria-label="Попередній місяць">
                <svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button id="cal-next" type="button" class="icon-btn" aria-label="Наступний місяць">
                <svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="cal-weekdays" aria-hidden="true"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>нд</span></div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>
      </div>

      <p id="day-status" class="day-status"></p>

      <section id="composition" class="composition" hidden aria-label="Склад дня">
        <div id="comp-bar" class="comp-bar"></div>
        <ul id="comp-legend" class="comp-legend"></ul>
      </section>

      <p id="why" class="margin-note" hidden></p>

      <div id="unscheduled" class="note-block" hidden>
        <h3>Не вмістилось</h3>
        <ul></ul>
      </div>

      <details id="history" class="note-block history" hidden>
        <summary></summary>
        <ol></ol>
      </details>

      <div id="plan-actions" class="plan-actions" hidden>
        <button id="gcal-btn" type="button" class="btn-ink" disabled>
          <span class="label">Додати в Google Calendar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="text-actions">
          <button id="ics-btn" type="button" class="text-btn" disabled>завантажити .ics</button>
          <button id="clear-btn" type="button" class="text-btn danger">очистити день</button>
        </div>
      </div>
    </aside>

    <section class="day" aria-label="План дня" aria-live="polite">
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <form id="dock" class="dock" autocomplete="off">
    <div class="dock-progress" aria-hidden="true"></div>
    <div id="rec-row" class="rec-row" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <span id="rec-time" class="rec-time">0:00</span>
      <div id="wave" class="wave" aria-hidden="true"></div>
      <span class="rec-hint">натисніть ще раз, щоб зупинити</span>
    </div>
    <div class="dock-row">
      <button id="mic" type="button" class="mic" aria-label="Почати запис" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5a3 3 0 0 0 3-3v-5a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" fill="currentColor"/><path d="M17.5 11.5a5.5 5.5 0 0 1-11 0M12 17v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="dock-field">
        <textarea id="dictation" rows="1" aria-label="Що у вас заплановано"></textarea>
        <div id="live" class="live" aria-hidden="true" hidden><span class="final"></span> <span class="interim"></span><span class="caret"></span></div>
      </div>
      <button id="plan-btn" type="submit" class="send" aria-label="Скласти план" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p id="dock-hint" class="dock-hint"></p>
  </form>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
