<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Мій день</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230071e3'/><circle cx='50' cy='50' r='26' fill='none' stroke='white' stroke-width='8'/><path d='M50 36v15l10 7' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow" id="date-label"></p>
      <h1>Мій день</h1>
      <div class="segmented" role="radiogroup" aria-label="День">
        <button type="button" role="radio" data-offset="0" aria-checked="true">Сьогодні</button>
        <button type="button" role="radio" data-offset="1" aria-checked="false">Завтра</button>
      </div>
    </header>

    <div id="setup-banner" class="banner" hidden>
      Підключіть Firebase: заповніть <code>public/config.js</code> — інструкція в README.
    </div>

    <section class="composer">
      <button id="mic" type="button" class="mic" aria-label="Почати запис" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/><path d="M18.5 11.5a6.5 6.5 0 0 1-13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <p id="mic-hint" class="hint">Натисніть і розкажіть, що у вас сьогодні</p>

      <div class="card field">
        <textarea id="dictation" rows="4" placeholder="Наприклад: о десятій стендап на пів години, о третій дзвінок з клієнтом, треба дописати звіт, сходити в спортзал і купити продукти…"></textarea>
      </div>

      <button id="plan-btn" type="button" class="btn primary wide" disabled>
        <span class="label">Скласти план</span>
      </button>
    </section>

    <section id="plan" class="plan" hidden aria-live="polite">
      <div class="plan-head">
        <h2>План</h2>
        <button id="reset-btn" type="button" class="link">Почати заново</button>
      </div>
      <p id="summary" class="summary"></p>
      <ol id="timeline" class="card timeline"></ol>

      <div id="unscheduled" class="card unscheduled" hidden>
        <h3>Не вмістилось</h3>
        <ul></ul>
      </div>

      <div class="actions">
        <button id="gcal-btn" type="button" class="btn primary wide">
          <span class="label">Додати в Google Calendar</span>
        </button>
        <button id="ics-btn" type="button" class="btn secondary wide">Завантажити .ics</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
